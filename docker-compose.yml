# ==============================================================================
# PlantDocBot — Docker Compose
# Usage:
#   1. Copy .env.example to .env and set GROQ_API_KEY
#   2. docker compose up --build
# ==============================================================================

services:
  plantdocbot:
    build: .
    container_name: plantdocbot
    ports:
      - "8501:8501" # Streamlit UI
      - "5000:5000" # FastAPI (optional)
    env_file:
      - .env
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      - model_cache:/app/models # persist model so it doesn't re-download
      - db_data:/app/database # persist SQLite DB
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8501/_stcore/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  model_cache:
  db_data:
