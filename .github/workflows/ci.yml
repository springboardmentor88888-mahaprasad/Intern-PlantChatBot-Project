# ==============================================================================
# PlantDocBot CI/CD — GitHub Actions
# Triggers on push to 'sayandip' or 'main' branch.
# 1. Lint & import check
# 2. Build Docker image
# 3. (Optional) Push image to Docker Hub / GHCR
# ==============================================================================

name: PlantDocBot CI/CD

on:
  push:
    branches: [sayandip, main]
  pull_request:
    branches: [main]

jobs:
  # ---- Job 1: Lint & smoke test ----
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Check imports
        run: |
          python -c "from config import settings; print('config OK')"
          python -c "from database.db import get_all_disease_keys; print('database OK')"
          python -c "from backend.api import app; print('FastAPI OK')"

      - name: Seed database
        run: python -c "from database.db import init_db; init_db(); print('DB seeded')"

  # ---- Job 2: Build Docker image ----
  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t plantdocbot:${{ github.sha }} .

      - name: Verify container starts
        run: |
          docker run -d --name test-plantdocbot \
            -e GROQ_API_KEY=test_key \
            -p 8501:8501 \
            plantdocbot:${{ github.sha }}
          sleep 15
          curl -f http://localhost:8501/_stcore/health || (docker logs test-plantdocbot && exit 1)
          docker stop test-plantdocbot
